# Chemistry file openers.
# Press Enter/l to use Litio, or O to choose Chemcraft from "Open with".
[opener]
litio = [
	{ run = "litio %s", orphan = true, desc = "Open with Litio", for = "unix" },
]
chemcraft = [
	{ run = 'for file in %s; do wine /home/vport/.wine/drive_c/Chemcraft/Chemcraft.exe "$file" >/dev/null 2>&1 & done', orphan = true, desc = "Open with Chemcraft", for = "unix" },
]

[open]
prepend_rules = [
	{ url = "*.{out,hess,xyz,trj,traj,trajectory}", use = [ "litio", "chemcraft" ] },
	# xTB writes an XYZ trajectory using a .log filename.
	{ url = "xtbopt.log", use = [ "litio", "chemcraft" ] },
]
