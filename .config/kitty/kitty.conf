font_family      Maple Mono NF
font_size        13.0

shell            /home/vport/.cargo/bin/nu

cursor_shape     beam
cursor_blink_interval 1

scrollback_lines 100000

window_padding_width 10
hide_window_decorations yes

background_opacity 0.7

# Dim inactive kitty windows/splits. Negative means only dim when there is
# more than one kitty window in the OS window, so a single focused terminal
# does not look washed out.
inactive_text_alpha -0.38

enable_audio_bell no
allow_remote_control yes
copy_on_select clipboard

include themes/noctalia.conf

# Tab bar
active_tab_font_style normal
inactive_tab_font_style normal
tab_bar_style custom
tab_bar_align center
tab_bar_margin_width 0
tab_bar_margin_height 7.0 7.0
tab_separator ""
tab_bar_background #2e3440


map alt+h remote_control_script /home/vport/.config/kitty/smart-focus.sh left
map alt+j remote_control_script /home/vport/.config/kitty/smart-focus.sh bottom
map alt+k remote_control_script /home/vport/.config/kitty/smart-focus.sh top
map alt+l remote_control_script /home/vport/.config/kitty/smart-focus.sh right
map alt+shift+h move_tab_backward
map alt+shift+l move_tab_forward
map ctrl+a>, set_tab_title
map ctrl+a>c new_tab_with_cwd !neighbor
map ctrl+a>| launch --cwd=current --location=hsplit
map ctrl+a>- launch --cwd=current --location=vsplit
map ctrl+a>x close_tab
map ctrl+a>z toggle_layout stack

